
name: Build ClientClient Fabric Mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Find mod project
        id: project
        shell: bash
        run: |
          if [ -f "./build.gradle" ]; then
            DIR="."
          else
            FILE=$(find . -mindepth 2 -name build.gradle \
              -not -path './.git/*' -print -quit)

            if [ -z "$FILE" ]; then
              echo "ERROR: build.gradle not found"
              exit 1
            fi

            DIR=$(dirname "$FILE")
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build Minecraft mod
        run: gradle --no-daemon clean build
        working-directory: ${{ steps.project.outputs.dir }}

      - name: Find mod JAR
        id: jar
        shell: bash
        run: |
          DIR="${{ steps.project.outputs.dir }}"
          JAR=$(find "$DIR/build/libs" -maxdepth 1 \
            -name '*.jar' \
            ! -name '*-dev.jar' \
            ! -name '*-sources.jar' \
            -print -quit)

          if [ -z "$JAR" ]; then
            echo "ERROR: No mod JAR produced"
            exit 1
          fi

          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload finished mod
        uses: actions/upload-artifact@v4
        with:
          name: ClientClient-Minecraft-Mod
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
